[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-plays"
version = "0.1.0"
description = "Autonomous game agent powered by TypeSafe AI's Jev (System One decision engine), starting with Pokémon Red."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Anthony Umeh", email = "anthonyumeh@example.com" }
]
dependencies = [
    "pyboy>=2.7.0",
    "typesafe-sdk>=0.7.0",
    "pydantic>=2.10.0",
    "pysdl2>=0.9.17",
    "pysdl2-dll>=2.32.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
jev-plays = "jev_plays.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

